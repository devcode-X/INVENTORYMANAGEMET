{% extends "base.html" %}

{% block title %}Restock {{ product.name }}{% endblock %}


{% block content %}
<h1>Restock {{ product.name }}</h1>
<form method="post" action="{% url 'restock_product' product.id %}">
    {% csrf_token %}
    <div class="mb-3">
        <label for="productName" class="form-label">Product Name</label>
        <input type="text" class="form-control" id="productName" value="{{ product.name }}" readonly>
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity" placeholder="Enter quantity" required>
    </div>
    <button type="submit" class="btn btn-primary">Restock</button>
</form>
<p class="mt-3">
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Back to Product List</a>
</p>
{% endblock %}
